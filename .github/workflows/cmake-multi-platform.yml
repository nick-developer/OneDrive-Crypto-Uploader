name: CMake Multi-Platform (Qt)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            qt_arch: gcc_64
          - os: macos-latest
            build_type: Release
            qt_arch: clang_64
          - os: windows-latest
            build_type: Release
            qt_arch: win64_msvc2022_64

    env:
      # serverReportedErrorOccurred / setTokenUrl / setRequestedScopeTokens
      # were introduced in Qt 6.9 — do not downgrade below 6.9.
      QT_VERSION: "6.9.1"
      BUILD_DIR: build/${{ matrix.os }}-${{ matrix.build_type }}

    steps:
      - uses: actions/checkout@v4

      # ── Linux ──────────────────────────────────────────────────────────────
      - name: Install prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build libssl-dev

      # ── macOS ──────────────────────────────────────────────────────────────
      - name: Install prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3

      # ── Windows ────────────────────────────────────────────────────────────
      - name: Install prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenSSL via vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: johnwason/vcpkg-action@v7
        with:
          pkgs: openssl
          triplet: x64-windows-release
          token: ${{ github.token }}

      # ── Qt (all platforms) ─────────────────────────────────────────────────
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtnetworkauth
          install-deps: true
          cache: true

      # ── Configure ──────────────────────────────────────────────────────────
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          OPENSSL_ROOT=$( [ "${{ runner.os }}" = "macOS" ] \
            && brew --prefix openssl@3 \
            || echo /usr )
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = "${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"
          if (!(Test-Path $toolchain)) { throw "vcpkg toolchain not found: $toolchain" }
          cmake -S . -B "$env:BUILD_DIR" -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DQt6_DIR="$env:QT_ROOT_DIR\lib\cmake\Qt6" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET="x64-windows-release"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        shell: bash
        run: cmake --build "${{ env.BUILD_DIR }}" --config ${{ matrix.build_type }} -j

      # ── Test (upload only runs if this passes) ─────────────────────────────
      - name: Test
        shell: bash
        run: ctest --test-dir "${{ env.BUILD_DIR }}" --output-on-failure

      # ── Artifacts ──────────────────────────────────────────────────────────
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: onedrive-crypto-uploader-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            ${{ env.BUILD_DIR }}/onedrive_crypto_uploader*
            ${{ env.BUILD_DIR }}/onedrive_crypto_uploader_tests*
          if-no-files-found: warn
